name: rnd-investor-contour

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -qx ok"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${RND_CONTOUR_DB_NAME:-rnd_contour}
      POSTGRES_USER: ${RND_CONTOUR_DB_USER:-rnd_contour}
      POSTGRES_PASSWORD: ${RND_CONTOUR_DB_PASSWORD:?Set RND_CONTOUR_DB_PASSWORD in Dokploy}
    volumes:
      - rnd_investor_contour_pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rnd_investor_contour_pgdata:
