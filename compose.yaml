name: rnd-investor-contour

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      NODE_ENV: production
      PGHOST: db
      PGDATABASE: ${RND_CONTOUR_DB_NAME:-rnd_contour}
      PGUSER: ${RND_CONTOUR_DB_USER:-rnd_contour}
      PGPASSWORD: ${RND_CONTOUR_DB_PASSWORD:?Set RND_CONTOUR_DB_PASSWORD in Epsilon Dokploy}
      EPSILON_ORIGIN: ${EPSILON_ORIGIN:?Set the HTTPS Epsilon origin}
      EPSILON_VAULT_KEY: ${EPSILON_VAULT_KEY:?Set an independent vault encryption key}
      EPSILON_BOOTSTRAP_EMAIL: ${EPSILON_BOOTSTRAP_EMAIL:?Set bootstrap email}
      EPSILON_BOOTSTRAP_HASH: ${EPSILON_BOOTSTRAP_HASH:?Set bootstrap hash, never a plaintext password}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${RND_CONTOUR_DB_NAME:-rnd_contour}
      POSTGRES_USER: ${RND_CONTOUR_DB_USER:-rnd_contour}
      POSTGRES_PASSWORD: ${RND_CONTOUR_DB_PASSWORD:?Set RND_CONTOUR_DB_PASSWORD in Dokploy}
    volumes:
      - rnd_investor_contour_pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rnd_investor_contour_pgdata:
